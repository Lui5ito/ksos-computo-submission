[project]
name = "dual-formulations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.68.1",
]

[tool.setuptools.packages.find]
where = ["dualforms"]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
